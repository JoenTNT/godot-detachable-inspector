<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1254 1254" fill="none">
	<title>Detachable Inspector</title>
	<desc>Two overlapping dark inspector windows with cyan controls and a blue magnifying glass on the left. Transparent background.</desc>
